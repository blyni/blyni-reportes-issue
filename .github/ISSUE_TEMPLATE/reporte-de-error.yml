name: Reporte de error
description: Algo de Blyni no funciona como debería
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisarnos. Un reporte completo nos ahorra días: llena lo que puedas y escribe «no sé» en lo demás.
        
        **Lo que escribes aquí es público.** No pongas contraseñas, claves ni datos personales, y tapa con un recuadro opaco lo que no deba verse en tus capturas. Si es un problema de seguridad, **no lo publiques**: abre un reporte que diga solo «Quiero reportar un problema de seguridad», sin detalles.
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      description: Dónde te pasó.
      options:
        - macOS
        - Windows
        - iPhone
        - iPad
        - Android
        - TV
        - Otra
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Lo que viste, en una o dos frases; no lo que crees que lo causa.
      placeholder: Al arrastrar una pestaña, la barra se queda congelada unos segundos.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Desde que abres Blyni, un paso por línea. Es lo más valioso del reporte.
      value: |
        1. Abro Blyni.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
      placeholder: Que la pestaña se quedara donde la solté.
    validations:
      required: true
  - type: dropdown
    id: frecuencia
    attributes:
      label: Con qué frecuencia pasa
      options:
        - Siempre
        - A veces
        - Solo una vez
        - No lo sé
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Tu equipo
      description: Sistema, versión del sistema y versión de Blyni. En el README está dónde ver cada dato.
      value: |
        - Sistema y versión:
        - Versión de Blyni:
        - Modelo del equipo (si es un teléfono, una tableta o una tele):
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Captura o video
      description: Arrastra aquí la imagen o el video, o pégalos con Cmd V / Ctrl V. Muestra la ventana completa de Blyni y tapa los datos personales con un recuadro opaco.
      placeholder: Arrastra aquí tus archivos
  - type: textarea
    id: extra
    attributes:
      label: Algo más
      description: Qué pestañas tenías abiertas, si lo acabas de instalar, si antes funcionaba…
  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué si ya estaba reportado.
          required: true
        - label: Tapé los datos personales de mis capturas y no incluí contraseñas ni claves.
          required: true
        - label: Entiendo que este reporte es público.
          required: true
